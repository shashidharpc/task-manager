<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Task Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/components/styles.css" />
</head>
<body class="auth-page">

  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">

        <div class="auth-card card shadow-sm">
          <div class="card-body p-4 p-md-5">

            <div class="mb-4">
              <h1 class="auth-title">Task Manager</h1>
              <p class="text-muted mb-0">Sign in to your account</p>
            </div>

            <div id="alert-container"></div>

            <form id="login-form" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="you@example.com"
                  required
                  autocomplete="email"
                />
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  placeholder="Enter your password"
                  required
                  autocomplete="current-password"
                />
              </div>

              <button type="submit" class="btn btn-primary w-100" id="login-btn">
                <span id="btn-text">Sign In</span>
                <span id="btn-spinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
              </button>
            </form>

            <hr class="my-4" />

            <p class="text-center text-muted mb-0 small">
              Don't have an account?
              <a href="/register" class="text-decoration-none">Create one</a>
            </p>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="/services/api.js"></script>
  <script>
    // Redirect if already logged in
    if (AuthService.isLoggedIn()) {
      window.location.href ="/dashboard";
    }

    const form = document.getElementById("login-form");
    const alertContainer = document.getElementById("alert-container");
    const loginBtn = document.getElementById("login-btn");
    const btnText = document.getElementById("btn-text");
    const btnSpinner = document.getElementById("btn-spinner");

    function showAlert(message, type = "danger") {
      alertContainer.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      `;
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      btnText.textContent = loading ? "Signing in..." : "Sign In";
      btnSpinner.classList.toggle("d-none", !loading);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertContainer.innerHTML = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showAlert("Please fill in all fields.");
        return;
      }

      setLoading(true);
      try {
        await AuthService.login(email, password);
        window.location.href = "/dashboard";
      } catch (err) {
        showAlert(err.message);
      } finally {
        setLoading(false);
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

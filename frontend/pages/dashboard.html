<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Task Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../components/styles.css" />
</head>
<body class="dashboard-page">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-md navbar-light bg-white border-bottom">
    <div class="container-fluid px-3 px-md-4">
      <span class="navbar-brand fw-semibold">Task Manager</span>
      <div class="d-flex align-items-center gap-3">
        <span class="text-muted small d-none d-sm-inline" id="user-greeting"></span>
        <button class="btn btn-outline-secondary btn-sm" id="logout-btn">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <div class="container-fluid px-3 px-md-4 py-4">

    <!-- Header row -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h5 class="mb-0 fw-semibold">My Tasks</h5>
      <button class="btn btn-primary btn-sm" id="add-task-btn">
        <i class="bi bi-plus-lg me-1"></i>Add Task
      </button>
    </div>

    <!-- Global error -->
    <div id="global-alert" class="d-none mb-3"></div>

    <!-- Loading state -->
    <div id="loading-state" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading tasks...</span>
      </div>
      <p class="text-muted mt-2 small">Loading your tasks...</p>
    </div>

    <!-- Board -->
    <div id="task-board" class="row g-3 d-none">

      <!-- Todo -->
      <div class="col-12 col-md-4">
        <div class="kanban-col">
          <div class="kanban-col-header d-flex justify-content-between align-items-center mb-3">
            <h6 class="mb-0 fw-semibold">
              <span class="status-dot todo"></span> Todo
            </h6>
            <span class="badge bg-secondary rounded-pill" id="count-todo">0</span>
          </div>
          <div id="col-todo" class="kanban-body">
            <!-- Task cards go here -->
          </div>
        </div>
      </div>

      <!-- In Progress -->
      <div class="col-12 col-md-4">
        <div class="kanban-col">
          <div class="kanban-col-header d-flex justify-content-between align-items-center mb-3">
            <h6 class="mb-0 fw-semibold">
              <span class="status-dot in-progress"></span> In Progress
            </h6>
            <span class="badge bg-secondary rounded-pill" id="count-inprogress">0</span>
          </div>
          <div id="col-inprogress" class="kanban-body">
          </div>
        </div>
      </div>

      <!-- Done -->
      <div class="col-12 col-md-4">
        <div class="kanban-col">
          <div class="kanban-col-header d-flex justify-content-between align-items-center mb-3">
            <h6 class="mb-0 fw-semibold">
              <span class="status-dot done"></span> Done
            </h6>
            <span class="badge bg-secondary rounded-pill" id="count-done">0</span>
          </div>
          <div id="col-done" class="kanban-body">
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Add/Edit Task Modal -->
  <div class="modal fade" id="task-modal" tabindex="-1" aria-labelledby="task-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="task-modal-title">Add Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="modal-alert"></div>
          <form id="task-form" novalidate>
            <input type="hidden" id="task-id" />
            <div class="mb-3">
              <label for="task-title" class="form-label">Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="task-title" placeholder="What needs to be done?" maxlength="100" required />
              <div class="form-text text-end"><span id="title-char-count">0</span>/100</div>
            </div>
            <div class="mb-3">
              <label for="task-description" class="form-label">Description</label>
              <textarea class="form-control" id="task-description" rows="3" placeholder="Add more details (optional)"></textarea>
            </div>
            <div class="mb-1">
              <label for="task-status" class="form-label">Status</label>
              <select class="form-select" id="task-status">
                <option value="Todo">Todo</option>
                <option value="In Progress">In Progress</option>
                <option value="Done">Done</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="save-task-btn">
            <span id="save-btn-text">Save Task</span>
            <span id="save-btn-spinner" class="spinner-border spinner-border-sm ms-1 d-none" role="status"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal fade" id="delete-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title">Delete Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-2">
          <p class="text-muted mb-0">Are you sure you want to delete this task? This cannot be undone.</p>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger btn-sm" id="confirm-delete-btn">
            <span id="delete-btn-text">Delete</span>
            <span id="delete-btn-spinner" class="spinner-border spinner-border-sm ms-1 d-none" role="status"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../services/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../components/dashboard.js"></script>
</body>
</html>
